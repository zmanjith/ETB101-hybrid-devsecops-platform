---
name: Build and Push to ECR # Workflow Name

on:
  push:
    # trigger - meaning when this workflow should run. Whenver you run git push to main branch, this workflow will run
    branches:
      - main
jobs:
  # creates a fresh machine with 'ubuntu-latest', no docker, no aws login, no kubectl, nothing. We have to do everything from scratch
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code # pull the GitHub repository code to the machine created.
        uses: actions/checkout@v3 # here it "uses" the checkout action to pull the code. This is a pre-built action by GitHub, we just have to call it.
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks-linux-amd64 -o gitleaks
          chmod +x gitleaks
        # we are using the official Gitleaks Docker image (ghcr.io/gitleaks/gitleaks) to run the scan. We mount the GitHub workspace to allow Gitleaks to access the code and scan for secrets. 
        # We also specify a custom configuration file (.gitleaks.toml) that defines the rules for scanning. 
        # The --redact flag is used to redact any secrets found in the logs, and --exit-code 1 will cause the build to fail if any secrets are detected.
        # this command runs the Gitleaks scan on the code. The 'detect' parameter tells Gitleaks to scan for secrets. We specify the severity levels to check for (HIGH and CRITICAL) and set the exit code to 1 if any secrets are found. We also disable the progress output for cleaner logs.
      - name: Run Gitleaks via Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest detect \  
            --source /repo \
            --config /repo/.gitleaks.toml \
            --redact \
            --exit-code 1
      - name: Configure AWS credentials # v3 is the version of the action, we can also use v2 or v1 but v3 is the latest and most stable one.
        uses: aws-actions/configure-aws-credentials@v2 # this is another pre-built action by GitHub to configure AWS credentials. We will use this to login to ECR and push our Docker image.
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} # we are using GitHub secrets to store our AWS credentials securely.
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} #  We will create these secrets in the GitHub repository settings.
          aws-region: us-east-1
      - name: Login to ECR # login to the ECR registry using the AWS CLI. This is required to push the Docker image to ECR.
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
      - name: Build Docker Image
        run: docker build -t hybrid-devsecops-etb101:v3 -f app/backend/Dockerfile
          app/backend
          # build the Docker image using the Dockerfile in the app/backend directory. The image will be tagged as hybrid-devsecops-etb101:latest
          # we are using the official Trivy Docker image (aquasec/trivy) to run the scan. We mount the Docker socket to allow Trivy to access the Docker daemon and scan the image.
      - name: Run Trivy Scan # run Trivy scan on the Docker image to check for vulnerabilities. If any HIGH or CRITICAL vulnerabilities are found, the build will fail with exit code 1.
        run: |
          docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v ${{ github.workspace }}:/workspace \
          aquasec/trivy image \  # this command runs the Trivy scan on the Docker image. The Trivy image expects an 'image' parameter. We specify the severity levels to check for (HIGH and CRITICAL) and set the exit code to 1 if any vulnerabilities are found. We also disable the progress output for cleaner logs.
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          --no-progress \
          hybrid-devsecops-etb101:v3
      - name: Tag image # tag the Docker image with the ECR repository URI. This is required to push the image to ECR.
        run: |
          docker tag hybrid-devsecops-etb101:v3 ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/hybrid-devsecops-etb101:v3
      - name: Push image # push the Docker image to ECR using the AWS CLI
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/hybrid-devsecops-etb101:v3
